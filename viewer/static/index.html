<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Golf course viewer</title>
    <link rel="stylesheet" href="/static/viewer.css" />
  </head>
  <body>
    <canvas id="map"></canvas>
    <aside id="panel">
      <h1 id="title">Loading…</h1>
      <p id="subtitle"></p>
      <section id="layers"></section>
      <section id="options">
        <label>Bounds for hole <select id="boundsHole"></select></label>
        <label>Relief exaggeration <input id="exag" type="range" min="1" max="10" step="0.5" value="3" /></label>
      </section>
      <pre id="readout">Move over the map.</pre>
      <p class="hint">Drag to pan, wheel to zoom, F to fit.</p>
    </aside>
    <script type="module" src="/static/viewer.js"></script>
  </body>
</html>
